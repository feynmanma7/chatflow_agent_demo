<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理财营销助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 800px;
            max-width: 95vw;
            height: 90vh;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部栏 */
        .chat-header {
            background: linear-gradient(135deg, #1677ff, #4096ff);
            color: #fff;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .chat-header .avatar {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .chat-header .title {
            font-size: 18px;
            font-weight: 600;
        }

        .chat-header .subtitle {
            font-size: 12px;
            opacity: 0.8;
        }

        /* 侧边栏 - 经理信息 */
        .sidebar-toggle {
            margin-left: auto;
            cursor: pointer;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(255,255,255,0.15);
            transition: background 0.2s;
        }

        .sidebar-toggle:hover {
            background: rgba(255,255,255,0.25);
        }

        /* 消息区域 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #d9d9d9;
            border-radius: 3px;
        }

        /* 消息气泡 */
        .message {
            display: flex;
            gap: 10px;
            max-width: 75%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message .bubble-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .bubble-avatar {
            background: #1677ff;
            color: #fff;
        }

        .message.assistant .bubble-avatar {
            background: #f0f2f5;
            color: #1677ff;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background: #1677ff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .bubble {
            background: #f0f2f5;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .bubble .timestamp {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 6px;
        }

        /* 加载动画 */
        .message.assistant .bubble.loading {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 14px 20px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #bbb;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 底部输入区 */
        .chat-input-area {
            padding: 16px 24px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .chat-input-area textarea {
            flex: 1;
            border: 1px solid #d9d9d9;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
        }

        .chat-input-area textarea:focus {
            border-color: #1677ff;
            box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: #1677ff;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: #4096ff;
            transform: scale(1.05);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
            transform: none;
        }

        /* 取消按钮 */
        .cancel-btn {
            width: 44px;
            height: 44px;
            border: 2px solid #ff4d4f;
            border-radius: 50%;
            background: #fff;
            color: #ff4d4f;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: cancelPulse 1.5s ease-in-out infinite;
        }

        .cancel-btn:hover {
            background: #ff4d4f;
            color: #fff;
        }

        @keyframes cancelPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 77, 79, 0.4); }
            50%      { box-shadow: 0 0 0 8px rgba(255, 77, 79, 0);   }
        }

        /* 快捷问题 */
        .quick-questions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 8px 24px 0;
            flex-shrink: 0;
        }

        .quick-btn {
            padding: 6px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #555;
        }

        .quick-btn:hover {
            border-color: #1677ff;
            color: #1677ff;
            background: #f0f5ff;
        }

        /* 设置弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            width: 360px;
            max-width: 90vw;
        }

        .modal h3 {
            margin-bottom: 16px;
            font-size: 16px;
        }

        .modal label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
            margin-top: 12px;
        }

        .modal input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .modal input:focus {
            border-color: #1677ff;
        }

        .modal .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .modal .btn-row button {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .modal .btn-cancel {
            background: #f0f0f0;
            color: #555;
        }

        .modal .btn-save {
            background: #1677ff;
            color: #fff;
        }

        /* 清空会话 */
        .clear-btn {
            margin-left: auto;
            padding: 4px 10px;
            font-size: 12px;
            border: none;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        .clear-btn:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- 顶部栏 -->
    <div class="chat-header">
        <div class="avatar">💼</div>
        <div>
            <div class="title">理财营销助手</div>
            <div class="subtitle">智能客户推荐 · 对话式营销</div>
        </div>
        <div class="sidebar-toggle" onclick="toggleSettings()">⚙️ 设置</div>
    </div>

    <!-- 快捷问题 -->
    <div class="quick-questions" id="quickQuestions">
        <button class="quick-btn" onclick="sendQuick('请帮我推荐理财类的客户。')">💡 推荐理财客户</button>
        <button class="quick-btn" onclick="sendQuick('请帮我推荐理财产品P12345的客户。')">📦 推荐产品客户</button>
    </div>

    <!-- 消息列表 -->
    <div class="chat-messages" id="chatMessages">
        <div class="message assistant">
            <div class="bubble-avatar">🤖</div>
            <div class="bubble">
                您好！我是理财营销助手。<br>您可以向我提问，例如：<br>• 推荐理财类的客户<br>• 推荐某款理财产品的潜在客户<br><br>请在右上角⚙️设置中填写您的经理ID。
                <div class="timestamp">刚刚</div>
            </div>
        </div>
    </div>

    <!-- 输入区 -->
    <div class="chat-input-area">
        <textarea
            id="userInput"
            placeholder="输入您的问题，按 Enter 发送..."
            rows="1"
            onkeydown="handleKeyDown(event)"
        ></textarea>
        <button class="cancel-btn" id="cancelBtn" onclick="cancelRequest()" style="display:none;" title="取消提问">✕</button>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <h3>⚙️ 理财经理设置</h3>
        <label>用户ID（用于会话保持）</label>
        <input type="text" id="userIdInput" placeholder="例如：manager001" value="manager001">
        <label>经理ID</label>
        <input type="text" id="managerIdInput" placeholder="例如：10001" value="10001">
        <div class="btn-row">
            <button class="btn-cancel" onclick="toggleSettings()">取消</button>
            <button class="btn-save" onclick="saveSettings()">保存</button>
        </div>
    </div>
</div>

<script>
    // ========== 状态 ==========
    const MCP_URL = 'http://localhost:9000/marketing';

    let userId = localStorage.getItem('chatflow_user_id') || 'manager001';
    let managerId = localStorage.getItem('chatflow_manager_id') || '10001';

    // 当前请求的 AbortController，用于取消
    let currentAbortController = null;

    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    // 初始化设置输入框
    document.getElementById('userIdInput').value = userId;
    document.getElementById('managerIdInput').value = managerId;

    // ========== 设置弹窗 ==========
    function toggleSettings() {
        document.getElementById('settingsModal').classList.toggle('show');
    }

    function saveSettings() {
        userId = document.getElementById('userIdInput').value.trim() || 'manager001';
        managerId = document.getElementById('managerIdInput').value.trim() || '10001';
        localStorage.setItem('chatflow_user_id', userId);
        localStorage.setItem('chatflow_manager_id', managerId);
        toggleSettings();
        addSystemMessage(`设置已更新：用户ID=${userId}, 经理ID=${managerId}`);
    }

    // 点击遮罩关闭
    document.getElementById('settingsModal').addEventListener('click', function(e) {
        if (e.target === this) toggleSettings();
    });

    // ========== 消息处理 ==========
    function addMessage(role, content) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        const avatar = role === 'user' ? '👤' : '🤖';

        const now = new Date();
        const time = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

        msgDiv.innerHTML = `
            <div class="bubble-avatar">${avatar}</div>
            <div class="bubble">
                ${escapeHtml(content)}
                <div class="timestamp">${time}</div>
            </div>
        `;

        chatMessages.appendChild(msgDiv);
        scrollToBottom();
    }

    function addLoadingMessage() {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message assistant';
        msgDiv.id = 'loadingMessage';
        msgDiv.innerHTML = `
            <div class="bubble-avatar">🤖</div>
            <div class="bubble loading">
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            </div>
        `;
        chatMessages.appendChild(msgDiv);
        scrollToBottom();
    }

    function removeLoadingMessage() {
        const el = document.getElementById('loadingMessage');
        if (el) el.remove();
    }

    function addSystemMessage(content) {
        const msgDiv = document.createElement('div');
        msgDiv.style.cssText = 'text-align:center;font-size:12px;color:#999;padding:4px 0;';
        msgDiv.textContent = content;
        chatMessages.appendChild(msgDiv);
        scrollToBottom();
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ========== UI 状态切换 ==========
    function setSending(isSending) {
        userInput.disabled = isSending;
        if (isSending) {
            sendBtn.style.display = 'none';
            cancelBtn.style.display = 'flex';
        } else {
            sendBtn.style.display = 'flex';
            cancelBtn.style.display = 'none';
            userInput.focus();
        }
    }

    // ========== 取消请求 ==========
    async function cancelRequest() {
        if (currentAbortController) {
            currentAbortController.abort();
            currentAbortController = null;
        }

        // 通知后端取消
        try {
            await fetch('/cancel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            });
        } catch (e) {
            // 忽略取消请求的网络错误
        }

        removeLoadingMessage();
        addSystemMessage('已取消当前提问');
        setSending(false);
    }

    // ========== 发送消息 ==========
    function sendQuick(text) {
        userInput.value = text;
        sendMessage();
    }

    async function sendMessage() {
        const query = userInput.value.trim();
        if (!query) return;

        // 禁用输入，显示取消按钮
        setSending(true);

        // 显示用户消息
        addMessage('user', query);
        userInput.value = '';
        userInput.style.height = 'auto';

        // 显示加载动画
        addLoadingMessage();

        // 创建 AbortController
        currentAbortController = new AbortController();

        try {
            const response = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: userId,
                    manager_id: managerId,
                    query: query
                }),
                signal: currentAbortController.signal
            });

            const data = await response.json();

            removeLoadingMessage();

            if (data.success) {
                addMessage('assistant', data.answer);
            } else {
                addMessage('assistant', data.detail || '处理请求时出现未知错误');
            }
        } catch (err) {
            removeLoadingMessage();
            if (err.name === 'AbortError') {
                // 用户取消，不显示错误
            } else {
                addMessage('assistant', '网络错误，无法连接到服务。请确认服务已启动。\n\n错误详情：' + err.message);
            }
        }

        currentAbortController = null;
        setSending(false);
    }

    // ========== 键盘事件 ==========
    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
        // Esc 取消请求
        if (event.key === 'Escape') {
            cancelRequest();
        }
    }

    // 自动调整 textarea 高度
    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
</script>

</body>
</html>
